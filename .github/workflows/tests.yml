name: tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # monthly, to catch library drift
    # min hour day-of-month month day-of-week
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Colab's Python version
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The notebooks download utils.py and the data from master if they
      # are missing; copy them so the solutions test this commit's versions.
      - name: Copy helper and data files
        run: cp utils.py *.csv *.png solutions/

      # The student version of bandit has blanks that don't run.
      - name: Run tests
        run: |
          pytest --nbmake solutions/*.ipynb [01]*.ipynb monty.ipynb elvis.ipynb clean_gss_bayes.ipynb
